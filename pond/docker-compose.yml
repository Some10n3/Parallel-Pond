version: '3.8'

services:
  redis-master:
    image: redis:latest
    container_name: redis-master
    restart: always
    ports:
      - "6379:6379"

  redis-replica-1:
    image: redis:latest
    container_name: redis-replica-1
    restart: always
    depends_on:
      - redis-master
    command: ["redis-server", "--replicaof", "redis-master", "6379"]

  redis-replica-2:
    image: redis:latest
    container_name: redis-replica-2
    restart: always
    depends_on:
      - redis-master
    command: ["redis-server", "--replicaof", "redis-master", "6379"]

  redis-replica-3:
    image: redis:latest
    container_name: redis-replica-3
    restart: always
    depends_on:
      - redis-master
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
